<!doctype html>

<html lang="en-US">

<head>
	<title>Gwent Classic</title>
	<meta charset="utf-8" />
	<meta name="author" content="Arun Sundaram" />
	<meta name="description" content="Play the original Gwent minigame from The Witcher 3 in your browser! Includes cards from Hearts of Stone and Blood & Wine!" />
	<meta name="keywords" content="arun, sundaram, programmer, gwent, tw3, witcher, card, game, gamedev, play" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

<div id="youtube"></div>

<div id="stage">

<div id="dimensions" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden;"></div>

<main>

	<section id="click-background" class="noclick"></section>

	<section id="panel-left" class="panel">

		<div id="exit-game" data-i18n-title="tip.exit"></div>
	
		<div id="leader-op" class="leader-box">
			<div class="leader-container center" data-i18n-title="tip.viewLeader"> 
			</div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<section id="stats-op" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			
			<div id="name-op" class="name" data-i18n="player.op"></div>
			<div id="deck-name-op" class="deck-name"></div>
			
			<div id="hand-count-op" class="hand-count">6</div>
			
			<div id="gem1-op" class="gem gem-on bg-contain"></div>
			<div id="gem2-op" class="gem gem-on bg-contain"></div>
			
			<div id="score-total-op" class="score-total"><div class="center">0</div></div>
			
			<div id="passed-op" data-i18n="passed"></div>
			
		</section>
		
		<div id="weather" class="card-container">
		</div>
		
		<section id="stats-me" class="stats">
			<div class="profile-img">
				<div><div></div></div>
			</div>
			<div id="passed-me" data-i18n="passed"></div>
			<div id="hand-count-me" class="hand-count">5</div>
			
			<div id="gem1-me" class="gem gem-on bg-contain"></div>
			<div id="gem2-me" class="gem gem-on bg-contain"></div>
			
			<div id="name-me" class="name"></div>
			<div id="deck-name-me" class="deck-name"></div>
			
			<div id="score-total-me" class="score-total"><div class="center">0</div></div>
			
			
		</section>
		
		<div id="leader-me" class="leader-box">
			<div class="leader-container center" data-i18n-title="tip.playLeader"></div>
			<div class="leader-active">
				<div></div>
			</div>
		</div>
		
		<div id="pass-button" class="center" data-i18n-title="tip.pass" data-i18n="pass"></div>
		
	</section>
	
	<section id="panel-mid" class="panel">
		<section id="field-op" class="field">
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-me" class="field">
			<div class="field-row" data-row="close">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="ranged">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
			<div class="field-row" data-row="siege">
				<div class="row-score center">0</div>
				<div class="row-special card-container"></div>
				<div class="row-cards card-container"></div>
				<div class="row-weather"></div>
			</div>
		</section>
		
		<section id="field-hand">
			<div id="hand-row" class="card-container card-selectable">
			</div>
		</section>
	</section>
	
	<section id="panel-right" class="panel">
		<div id="grave-op" class="grave cardpile" data-i18n-title="tip.discards">
		</div>
		<div id="deck-op" class="cardpile">
		
		</div>
		<div id="grave-me" class="grave cardpile" data-i18n-title="tip.discards">
		</div>
		<div id="deck-me" class="cardpile">
		</div>
	</section>
	
	<div id="hand-op"></div>
	
	<section class="card-preview hide">
		<div class="card-lg"></div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
	</section>
	
	<section id="carousel" class="hide">
		<div>
			<div class="card-lg" onclick="Carousel.curr.shift(event,-2)" onmouseover="Carousel.curr?.nudge(-2)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event,-1)" onmouseover="Carousel.curr?.nudge(-1)"></div>
			<div class="card-lg" onclick="Carousel.curr.select(event)"   onmouseover="Carousel.curr?.nudge( 0)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event, 1)" onmouseover="Carousel.curr?.nudge( 1)"></div>
			<div class="card-lg" onclick="Carousel.curr.shift(event, 2)" onmouseover="Carousel.curr?.nudge( 2)"></div>
		</div>
		<div class="card-description">
			<div></div>
			<h1></h1>
			<p></p>
		</div>
		<div></div>
	</section>
	
	
	<section id="popup" class="center hide">
		<div>
			<h3></h3>
			<p></p>
			<div>
				<button onclick="Popup.curr.selectYes()"></button>
				<button onclick="Popup.curr.selectNo()"></button>
			</div>
		</div>
	</section>
	
	
	<section id="notification-bar" class="hide">
		<div></div>
	</section>
	
	<section id="end-screen" class="hide">
		<div></div>
		<table>
			<colgroup>
				<col span="3" />
				<col span="1" />
				<col span="1" />
				<col span="1" />
			</colgroup>
			<tbody>
				<tr>
					<th colspan="2"></th>
					<th data-i18n="round1"></th>
					<th data-i18n="round2"></th>
					<th data-i18n="round3"></th>
				</tr>
				<tr>
					<th colspan="2">Geralt</th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
				<tr>
					<th colspan="2">Opponent</th>
					<td>0</td>
					<td>0</td>
					<td>0</td>
				</tr>
			</tbody>
		</table>
		<p class="hide" data-i18n="end.draw"></p>
		<button data-i18n="end.customize"></button>
		<button data-i18n="end.rematch"></button>
		<button data-i18n="end.newGame"></button>
	</section>
	
	<section id="deck-selector">
		
	</section>
	

</main>

<section id="deck-customization">
	<div id="faction-title">
		<div id="faction-prev" class="faction-neighbors"></div>
		<button id="faction-left" class="faction-arrow" data-i18n-title="deck.prevFaction"></button>
		<h1><span class="faction-shield-main"></span><span class="faction-name"></span></h1>
		<button id="faction-right" class="faction-arrow" data-i18n-title="deck.nextFaction"></button>
		<div id="faction-next" class="faction-neighbors"></div>
	</div>
	<p id="faction-description"></p>

	<div id="deck-io">
		<label id="upload-deck" class="deck-button" data-i18n-title="deck.uploadTip">
			<input type="file" id="add-file" accept=".json,application/json" style="display:none;"/><span data-i18n="deck.upload"></span>
		</label>
		<button id="download-deck" class="deck-button" data-i18n="deck.download" data-i18n-title="deck.downloadTip"></button>
		<div data-i18n-title="tip.language" id="toggle-language" class="center deck-menu settings-button"></div>
	</div>
	<a id="download-json" style="display:none;"></a>
	
	<h2 id="card-bank-title" class="card-contianer-title" data-i18n="deck.collection"></h2>
	<h2 id="card-deck-title" class="card-contianer-title" data-i18n="deck.inDeck"></h2>
	<div id="card-bank" class="card-array">
	</div>
	<div id="card-deck" class="card-array">
	</div>
	<div id="card-leader">
		<p data-i18n="deck.leader"></p>
		<div></div>
	</div>
	<div id="deck-stats">
		<p data-i18n="deck.total"></p>
		<p>0</p>
		<p data-i18n="deck.units"></p>
		<p>0</p>
		<p data-i18n="deck.special"></p>
		<p>0/10</p>
		<p data-i18n="deck.strength"></p>
		<p>0</p>
		<p data-i18n="deck.heroes"></p>
		<p>0</p>
	</div>
	<div id="difficulty" class="center">
		<span data-i18n="deck.difficulty"></span>
		<button data-level="easy" data-i18n="difficulty.easy" data-i18n-title="difficulty.easy.tip"></button>
		<button data-level="normal" data-i18n="difficulty.normal" data-i18n-title="difficulty.normal.tip"></button>
		<button data-level="hard" data-i18n="difficulty.hard" data-i18n-title="difficulty.hard.tip"></button>
	</div>
	<button id="start-game"><span data-i18n="deck.start"></span></button>
	<div id="opponent-preview">
		<span class="op-label" data-i18n="deck.opponent"></span>
		<label id="op-preview-leader" for="add-opponent" data-i18n-title="tip.uploadOpponent">
			<input type="file" id="add-opponent" accept=".json,application/json" style="display:none;"/>
			<span id="op-preview-faction" class="hide"></span>
			<p data-i18n="deck.random"></p>
		</label>
		<button id="op-preview-open" class="hide" data-i18n-title="tip.viewOpponent"></button>
		<button id="op-preview-clear" class="hide" data-i18n-title="tip.clearOpponent"></button>
	</div>
</section>

<div id="toggle-music" class="center deck-menu settings-button"><img src="svg/music.svg"></img></div>
<div id="toggle-sfx" class="center deck-menu settings-button"><img src="svg/sfx.svg"></img></div>
<div data-i18n-title="tip.notifications" id="toggle-notifications" class="center deck-menu settings-button"><img src="svg/notification.svg"></img></div>

</div><!-- #stage -->

<script type="text/javascript" src="common.js"></script>
<script type="text/javascript" src="cards.js"></script>
<script type="text/javascript" src="decks.js"></script>
<script type="text/javascript" src="abilities.js"></script>
<script type="text/javascript" src="factions.js"></script>
<script type="text/javascript" src="i18n_fr_data.js"></script>
<script type="text/javascript" src="i18n.js"></script>
<script type="text/javascript" src="card_ribbons.js"></script>
<script type="text/javascript" src="gwent.js"></script>
<script type="text/javascript" src="wem2ogg.js"></script>
<script type="text/javascript" src="music.js"></script>
<script type="text/javascript" src="input.js"></script>
</body>

</html>
