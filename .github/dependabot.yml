version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule: {interval: monthly}
    groups:
      cargo-minor: {update-types: [minor, patch]}
  - package-ecosystem: npm
    directory: /server
    schedule: {interval: monthly}
  - package-ecosystem: npm
    directory: /desktop
    schedule: {interval: monthly}
