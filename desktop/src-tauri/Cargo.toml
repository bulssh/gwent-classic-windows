[package]
name = "gwent-classic"
version = "2.3.2"
description = "Gwent Classic - le Gwynt de The Witcher 3"
authors = ["bulssh"]
license-file = "../../LICENSE"
repository = "https://github.com/bulssh/gwent-classic-windows"
edition = "2021"

[lib]
name = "gwent_classic_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# embeds the game files in the executable and serves them through the custom protocol (production)
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
